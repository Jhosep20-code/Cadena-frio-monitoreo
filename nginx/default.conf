# Configuracion del proxy: reparte las consultas entre los dos nodos
upstream nodos_cadena_frio {
    server nodo-huancayo:8000 max_fails=0;
    server nodo-jauja:8000 max_fails=0;
}

server {
    listen 80;
    server_name localhost;

    # Cada peticion cae alternadamente en un nodo distinto,
    # lo que se comprueba mirando el campo "sede" de la respuesta
    location / {
        proxy_pass http://nodos_cadena_frio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
